name: ofes-harvester

on:
  workflow_dispatch:
    inputs:
      year_start:
        description: "start year (2-digit)"
        default: "21"
      year_end:
        description: "end year (2-digit)"
        default: "26"
      suffix_start:
        description: "suffix start"
        default: "1"
      suffix_end:
        description: "suffix end"
        default: "99999"
      workers:
        description: "worker threads"
        default: "16"
      jitter_ms:
        description: "jitter ms"
        default: "10"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ofes.yml"
      - "ofes_worker.py"

permissions:
  contents: write

concurrency:
  group: ofes-harvester
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 urllib3==2.2.3 openpyxl==3.1.5

      - name: Configure git
        run: |
          git config user.email "ofes-worker@users.noreply.github.com"
          git config user.name  "ofes-worker"

      - name: Run harvester
        env:
          YEAR_START:    ${{ github.event.inputs.year_start || '21' }}
          YEAR_END:      ${{ github.event.inputs.year_end   || '26' }}
          SUFFIX_START:  ${{ github.event.inputs.suffix_start || '1' }}
          SUFFIX_END:    ${{ github.event.inputs.suffix_end   || '99999' }}
          WORKERS:       ${{ github.event.inputs.workers      || '16' }}
          JITTER_MS:     ${{ github.event.inputs.jitter_ms    || '10' }}
          RESUME:        "1"
          AUTO_SCRAPE:   "1"
          COMMIT_EVERY:  "25"
          REPO_ROOT:     ${{ github.workspace }}
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: python ofes_worker.py

      - name: Final commit
        if: always()
        run: |
          git add ofes_data.xlsx ofes_hits.txt ofes_errors.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "ofes: final flush" || true
            git push origin HEAD:main || true
          fi
